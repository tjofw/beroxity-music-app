<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#100b1d"/>
<meta name="description" content="Official BEROXITY MUSIC development changelog."/>
<title>Changelog | BEROXITY MUSIC</title>
<style>
:root{color-scheme:dark;--bg:#0e0a17;--panel:#181126;--line:#342448;--txt:#f6f0ff;--muted:#b3a4c5;--accent:#b46cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 70% 38% at 50% -10%,#422063 0%,transparent 75%),var(--bg);color:var(--txt);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:0 24px}header{border-bottom:1px solid var(--line)}nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.08em}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,#dcadff,#8b3fe6);display:grid;place-items:center;color:#170b25;font-weight:950;font-size:25px;box-shadow:0 0 24px #8f47dc66}.navlink{font-size:14px;color:var(--muted)}.navlink:hover{color:white}.hero{padding:72px 0 52px}.eyebrow{color:#d2a1ff;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800}.hero h1{font-size:clamp(42px,7vw,70px);line-height:1.08;margin:14px 0 18px;letter-spacing:-.045em}.hero p{max-width:650px;color:var(--muted);font-size:18px;margin:0}.pill{display:inline-block;padding:5px 12px;border:1px solid #7949a6;border-radius:99px;color:#d9b2ff;font-size:12px;font-weight:750;background:#6f329522}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin:24px 0}.toolbar h2{margin:0;font-size:23px}.toolbar input{border:1px solid var(--line);background:#1a1327;color:white;border-radius:12px;padding:12px 15px;min-width:min(300px,100%);font:inherit;outline:none}.toolbar input:focus{border-color:var(--accent)}.entry{background:linear-gradient(150deg,#20152e,#16101f);border:1px solid var(--line);border-radius:18px;padding:28px;margin:20px 0;box-shadow:0 14px 40px #0002}.entry-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.entry time{color:var(--muted);font-size:13px}.entry h3{font-size:26px;line-height:1.3;margin:13px 0 8px}.entry .summary{color:var(--muted);margin:0 0 22px}.group{margin:20px 0}.group h4{margin:0 0 10px;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:#d9b2ff}.group ul{margin:0;padding-left:22px}.group li{padding:3px 0;color:#e4d8ef}.empty{color:var(--muted);padding:30px 0}footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;margin-top:60px;padding:25px 0}footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}@media(max-width:600px){.hero{padding:52px 0 28px}.entry{padding:20px}.brand{font-size:13px}.navlink{font-size:12px}}
</style>
</head>
<body>
<header><div class="wrap"><nav><a class="brand" href="./"><span class="mark">B</span><span>BEROXITY MUSIC</span></a><a class="navlink" href="https://github.com/" target="_blank" rel="noopener">Powered by GitHub Pages ↗</a></nav></div></header>
<main class="wrap"><section class="hero"><span class="eyebrow">BEROXITY CODES / DEVELOPMENT</span><h1>Built better.<br/>Update by update.</h1><p>New features, improvements, and fixes for BEROXITY MUSIC. Your Music. Your Library. Your Rules.</p><p style="margin-top:24px"><span class="pill">● ALPHA DEVELOPMENT</span></p></section><section aria-label="Release history"><div class="toolbar"><h2>Changelog</h2><input id="search" type="search" placeholder="Search updates..." aria-label="Search updates"/></div><div id="releases" aria-live="polite"><p class="empty">Loading updates...</p></div></section></main>
<footer><div class="wrap"><span>© <span id="year"></span> BEROXITY CODES</span><span>Made for your music library.</span></div></footer>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const root=document.getElementById('releases');const input=document.getElementById('search');let releases=[];
const el=(tag,cls,content)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(content!==undefined)node.textContent=content;return node};
function render(){const term=input.value.trim().toLowerCase();root.replaceChildren();const matched=releases.filter(r=>JSON.stringify(r).toLowerCase().includes(term));if(!matched.length){root.append(el('p','empty','No matching updates found.'));return}for(const release of matched){const article=el('article','entry');const head=el('div','entry-head');head.append(el('span','pill',release.version||'Development Update'));const date=el('time','',release.date||'Date to be announced');if(release.date&&/^\d{4}-\d{2}-\d{2}$/.test(release.date))date.dateTime=release.date;head.append(date);article.append(head,el('h3','',release.title||'Development Update'),el('p','summary',release.summary||''));for(const group of release.sections||[]){const sec=el('section','group');sec.append(el('h4','',group.title||'Changes'));const ul=el('ul');for(const item of group.items||[])ul.append(el('li','',item));sec.append(ul);article.append(sec)}root.append(article)}}
input.addEventListener('input',render);
fetch('./changelog.json').then(r=>{if(!r.ok)throw Error('Cannot load changelog');return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('Expected list of updates');releases=data;render()}).catch(()=>{root.replaceChildren(el('p','empty','Could not load changelog.json. Make sure the site is hosted using GitHub Pages.'))});
</script>
</body></html>
