# ADD ONLY these entries beneath the EXISTING `content:` list in .pages.yml.
# Do not add a second `content:` key or replace your Changelog releases entry.
  - name: roadmap
    label: Development Roadmap
    type: file
    path: content/roadmap.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Feature title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: status
        label: Development status
        type: select
        options:
          values: [Planned, In Development, Testing, Released]

  - name: features
    label: Features Showcase
    type: file
    path: content/features.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Feature title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: icon
        label: Symbol or emoji
        type: string

  - name: docs
    label: Documentation
    type: file
    path: content/docs.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      - name: category
        label: Category
        type: string
      - name: title
        label: Guide title
        type: string
        required: true
      - name: summary
        label: Short summary
        type: text
      - name: body
        label: Guide content (plain text)
        type: text

  - name: screenshots
    label: Screenshot Gallery
    type: file
    path: content/screenshots.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Screenshot title
        type: string
        required: true
      - name: src
        label: Image path (assets/screenshots/filename.png)
        type: string
        required: true
        pattern: '^assets/screenshots/[a-zA-Z0-9_.-]+\\.(png|jpg|jpeg|webp)$'
