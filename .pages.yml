media: media
content:
  - name: releases
    label: Changelog releases
    type: collection
    path: releases
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, version, date, status]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Release title
        type: string
        required: true
      - name: version
        label: Version / release label
        type: string
        required: true
      - name: date
        label: Date (YYYY-MM-DD)
        type: string
      - name: status
        label: Publishing status
        type: select
        options:
          values: [Published, Draft]
      - name: summary
        label: Summary
        type: text
      - name: sections
        label: Changelog sections
        type: object
        list: true
        fields:
          - name: title
            label: Section heading
            type: string
          - name: items
            label: Changes
            type: string
            list: true

  - name: roadmap
    label: Development Roadmap
    type: file
    path: content/roadmap.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Feature title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: status
        label: Development status
        type: select
        options:
          values: [Planned, In Development, Testing, Released]

  - name: features
    label: Features Showcase
    type: file
    path: content/features.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Feature title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: icon
        label: Symbol or emoji
        type: string

  - name: docs
    label: Documentation
    type: file
    path: content/docs.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      - name: category
        label: Category
        type: string
      - name: title
        label: Guide title
        type: string
        required: true
      - name: summary
        label: Short summary
        type: text
      - name: body
        label: Guide content (plain text)
        type: text

  - name: screenshots
    label: Screenshot Gallery
    type: file
    path: content/screenshots.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: title
        label: Screenshot title
        type: string
        required: true
      - name: src
        label: Image path (assets/screenshots/filename.png)
        type: string
        required: true
        pattern: '^assets/screenshots/[a-zA-Z0-9_.-]+\\.(png|jpg|jpeg|webp)$'
